[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-leo-traversal"
version = "0.1.0"
description = "Simulation and validation tools for adaptive LEO traversal with time-varying delay and link recovery."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "adaptive-leo-traversal contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
