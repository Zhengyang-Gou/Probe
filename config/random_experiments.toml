[scenario]
# Number of randomized experiment scenarios to run.
count = 2000
seed = 7
# When a scenario reaches one of these terminal statuses, it is recorded and
# the runner immediately starts the next scenario.
interrupt_statuses = ["temporarily_unreachable", "partial_result"]

[grid]
# 10 x 10 = 100 simulated satellite nodes.
rows = 10
cols = 10

[delay]
model = "leo"
period_slots = 8

[leo_delay]
intra_delay = 1.0
inter_min_delay = 1.2
inter_max_delay = 3.0

[random_delay]
min_delay = 0.8
max_delay = 3.0

[failure]
# "probability": each edge is independently selected with down_probability.
# "fixed_count": exactly down_edges_per_scenario random edges are selected.
mode = "probability"
down_probability = 0.1
down_edges_per_scenario = 18

[traversal]
max_hop = 0
alpha = 0.85

[simulation]
step_time = 1.0

[srv6]
enabled = true
locator_prefix = "fc00:0"
base_srh_overhead_bytes = 8
per_sid_overhead_bytes = 16

[output]
base_dir = "logs/random"
run_name = ""
write_stdout = true
